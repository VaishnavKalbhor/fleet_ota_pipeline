apiVersion: apps/v1
kind: Deployment
metadata:
  name: climate-control
  namespace: fleet-ota
  labels:
    app: climate-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: climate-control
  template:
    metadata:
      labels:
        app: climate-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: climate-control
          image: ghcr.io/kalbhor1124/fleet-ota/climate-control:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
